<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- DSiの画面横幅（240〜256px）に最適化 -->
    <meta name="viewport" content="width=device-width, initial-scale=240, user-scalable=no">
    <title>DSiタイマー</title>
    <style>
        /* DSi向けにクラシックなCSSのみでスタイリング */
        body {
            background-color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            max-width: 230px;
            margin: 0 auto;
        }
        h1 {
            font-size: 16px;
            margin: 5px 0;
            color: #333;
        }
        /* DSiの画面で見やすい大きなデジタル表示 */
        .display {
            font-size: 40px;
            font-weight: bold;
            color: #0055ff;
            font-family: monospace;
            margin: 10px 0;
            background-color: #e6f0ff;
            border: 1px solid #b3d1ff;
            border-radius: 4px;
            padding: 5px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-box {
            display: inline-block;
            margin: 0 5px;
        }
        .input-box label {
            display: block;
            font-size: 11px;
            color: #666;
        }
        /* タッチしやすい大きめの入力欄 */
        .num-input {
            width: 45px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 3px;
            border: 1px solid #999;
        }
        .btn-zone {
            margin-top: 10px;
        }
        /* DSiのスタイラスペンや指で押しやすい巨大なボタン */
        .btn {
            font-size: 16px;
            font-weight: bold;
            padding: 10px 12px;
            margin: 0 4px;
            border: 1px solid #666;
            border-radius: 4px;
            background-color: #eee;
            cursor: pointer;
        }
        .btn-start { background-color: #22cc77; color: white; border-color: #11aa55; }
        .btn-stop { background-color: #ffaa00; color: white; border-color: #dd8800; display: none; }
        .btn-reset { background-color: #999999; color: white; border-color: #777777; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏰ DSi TIMER</h1>
        
        <!-- タイマー表示 -->
        <div class="display" id="timer-display">03:00</div>

        <!-- 設定フォーム -->
        <div class="input-group" id="input-container">
            <div class="input-box">
                <label>分</label>
                <input type="number" id="input-minutes" value="3" min="0" max="99" class="num-input">
            </div>
            <div class="input-box">
                <label>秒</label>
                <input type="number" id="input-seconds" value="0" min="0" max="59" class="num-input">
            </div>
        </div>

        <!-- 操作ボタン -->
        <div class="btn-zone">
            <button id="btn-start" class="btn btn-start">スタート</button>
            <button id="btn-stop" class="btn btn-stop">停止</button>
            <button id="btn-reset" class="btn btn-reset">リセット</button>
        </div>
    </div>

    <script type="text/javascript">
        // --- DSi（ES5以前）でも絶対に動くレガシーJavaScript ---
        var countdown;
        var timeLeft = 180;
        var isRunning = false;

        var display = document.getElementById('timer-display');
        var minutesInput = document.getElementById('input-minutes');
        var secondsInput = document.getElementById('input-seconds');
        var startBtn = document.getElementById('btn-start');
        var stopBtn = document.getElementById('btn-stop');
        var resetBtn = document.getElementById('btn-reset');
        var inputContainer = document.getElementById('input-container');

        // 桁埋め用のレガシー関数（padStartが使えないため自作）
        function padZero(num) {
            return (num < 10) ? '0' + num : '' + num;
        }

        function updateDisplay(seconds) {
            var mins = Math.floor(seconds / 60);
            var secs = seconds % 60;
            display.innerHTML = padZero(mins) + ':' + padZero(secs);
        }

        function setTimeFromInput() {
            var mins = parseInt(minutesInput.value, 10);
            var secs = parseInt(secondsInput.value, 10);
            if (isNaN(mins)) mins = 0;
            if (isNaN(secs)) secs = 0;
            timeLeft = (mins * 60) + secs;
            updateDisplay(timeLeft);
        }

        function startTimer() {
            if (isRunning) return;
            if (timeLeft <= 0) setTimeFromInput();
            if (timeLeft <= 0) return;

            isRunning = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            
            // DSi用にdisabledで入力制御
            minutesInput.disabled = true;
            secondsInput.disabled = true;

            countdown = setInterval(function() {
                timeLeft--;
                updateDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resetTimer();
                    // DSiブラウザは音が鳴らないため、アラートのポップアップがタイムアップの合図になります
                    alert('時間になりました！');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            setTimeFromInput();
        }

        // DSiのOperaに対応した古いイベントリスナー
        if (startBtn.addEventListener) {
            startBtn.addEventListener('click', startTimer, false);
            stopBtn.addEventListener('click', stopTimer, false);
            resetBtn.addEventListener('click', resetTimer, false);
            minutesInput.addEventListener('change', setTimeFromInput, false);
            secondsInput.addEventListener('change', setTimeFromInput, false);
        } else if (startBtn.attachEvent) { // 念のための予備
            startBtn.attachEvent('onclick', startTimer);
            stopBtn.attachEvent('onclick', stopTimer);
            resetBtn.attachEvent('onclick', resetTimer);
        }
        
        // 初期実行
        setTimeFromInput();
    </script>
</body>
</html>
