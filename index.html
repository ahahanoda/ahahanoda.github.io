<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GifTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎬 GifTube</h1>
    
    <!-- トークン入力（自分用・隠蔽用） -->
    <div id="auth">
        <input type="password" id="token" placeholder="GitHub Access Token">
    </div>

    <!-- アップロードエリア -->
    <div id="upload-form">
        <input type="file" id="gif-file" accept=".gif">
        <button id="upload-btn">アップロード</button>
    </div>

    <!-- 一覧表示エリア -->
    <div id="gif-list"></div>

    <script src="app.js"></script>
</body>
</html>
