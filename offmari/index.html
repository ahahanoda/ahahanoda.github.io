<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5c94fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ピクセルヒーロー</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;background:#5c94fc;display:block}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.grp{display:flex;gap:12px}
.btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);color:#fff;font:bold 15px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn.on{background:rgba(255,255,255,.55)}
#mute{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;width:36px;height:36px;border-radius:8px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="mute" aria-label="音">🔊</button>
<div id="pad">
  <div class="grp"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
  <div class="grp"><div class="btn" data-k="run">ダッシュ</div><div class="btn" data-k="jump">ジャンプ</div></div>
</div>
<script>
(()=>{
'use strict';
const VW=320, VH=272, TS=16, MW=140, MH=17, G=0.34, FLAGX=128*TS;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
cv.width=VW; cv.height=VH; ctx.imageSmoothingEnabled=false;
function resize(){const s=Math.min(innerWidth/VW, innerHeight/VH); cv.style.width=Math.floor(VW*s)+'px'; cv.style.height=Math.floor(VH*s)+'px';}
addEventListener('resize',resize); resize();

// ---------- 状態 ----------
let state='title', frame=0, score=0, coinsN=0, lives=3, best=0, lockUntil=0, cam=0;
let offlineReady=false, offMsg='', muted=false, jumpHeld=false, jumpBuf=0;
try{best=+localStorage.getItem('pxh-best')||0; muted=localStorage.getItem('pxh-mute')==='1';}catch(e){}
const keys={left:false,right:false,jump:false,run:false};
let map, coinList, enemies, particles=[], popups=[];
const p={x:0,y:0,w:12,h:14,vx:0,vy:0,face:1,onGround:false,dead:0,win:0,anim:0};

// ---------- サウンド(ファイル不要・WebAudio) ----------
let ac=null;
function tone(f1,f2,d,type,v,delay){
  if(muted) return;
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function sfx(n){
  if(n==='jump') tone(280,620,0.15);
  else if(n==='coin'){tone(988,988,0.07);tone(1319,1319,0.22,'square',0.05,0.07);}
  else if(n==='stomp') tone(400,100,0.12);
  else if(n==='brk') tone(200,60,0.15,'sawtooth');
  else if(n==='die'){tone(500,80,0.5,'square',0.06);}
  else if(n==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.18,'square',0.05,i*0.15));}
}
const muteBtn=document.getElementById('mute');
function showMute(){muteBtn.textContent=muted?'🔇':'🔊';}
muteBtn.addEventListener('click',()=>{muted=!muted;showMute();try{localStorage.setItem('pxh-mute',muted?'1':'0');}catch(e){}});
showMute();

// ---------- ステージ ----------
function buildLevel(){
  map=Array.from({length:MH},()=>new Uint8Array(MW));
  const fill=(x1,x2,y1,y2,t)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)map[y][x]=t;};
  // 1=地面 2=レンガ 3=?ブロック 4=使用済み 5=階段 7=土管
  fill(0,MW-1,15,16,1);
  [[26,28],[50,53],[80,82],[104,106]].forEach(g=>fill(g[0],g[1],15,16,0));
  [[20,2],[34,3],[44,2],[64,2],[72,3],[92,2]].forEach(a=>fill(a[0],a[0]+1,15-a[1],14,7));
  map[12][10]=3; map[12][12]=2; map[12][13]=3; map[12][14]=2; map[12][15]=3; map[8][13]=3;
  fill(38,42,12,12,2); map[12][40]=3;
  fill(56,60,12,12,2); map[12][58]=3;
  fill(84,88,12,12,2); map[12][86]=3;
  for(let i=0;i<6;i++) fill(116+i,116+i,14-i,14,5);
  coinList=[];
  const C=(x,y)=>coinList.push({x,y,got:false});
  [26,27,28,50,51,52,53,80,81,82,104,105,106,68,69,70].forEach(x=>C(x,11));
  for(let x=38;x<=42;x++)C(x,10);
  for(let x=56;x<=60;x++)C(x,10);
  for(let x=84;x<=88;x++)C(x,10);
  enemies=[16,24,31,38,47,58,68,76,88,98,108,112].map(x=>({x:x*TS,y:15*TS-14,w:14,h:14,vx:0,vy:0,dir:-1,dead:0,active:false}));
  particles=[]; popups=[];
}
function resetPlayer(){
  Object.assign(p,{x:2*TS,y:15*TS-14,vx:0,vy:0,face:1,onGround:false,dead:0,win:0,anim:0});
  cam=0; jumpBuf=0;
}
function start(){
  lives=3; score=0; coinsN=0; buildLevel(); resetPlayer(); state='play'; jumpHeld=true;
}
function saveBest(){ if(score>best){best=score; try{localStorage.setItem('pxh-best',String(best));}catch(e){}} }

// ---------- 物理 ----------
function solidAt(tx,ty){
  if(tx<0||tx>=MW) return true;
  if(ty<0||ty>=MH) return false;
  return map[ty][tx]>0;
}
function moveBody(b){
  const r={hx:false,ground:false,head:null};
  b.x+=b.vx;
  let y0=Math.floor(b.y/TS), y1=Math.floor((b.y+b.h-0.01)/TS);
  if(b.vx>0){
    const tx=Math.floor((b.x+b.w-0.01)/TS);
    for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){b.x=tx*TS-b.w;b.vx=0;r.hx=true;break;}
  }else if(b.vx<0){
    const tx=Math.floor(b.x/TS);
    for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){b.x=(tx+1)*TS;b.vx=0;r.hx=true;break;}
  }
  b.vy+=G; if(b.vy>7) b.vy=7;
  b.y+=b.vy;
  const x0=Math.floor(b.x/TS), x1=Math.floor((b.x+b.w-0.01)/TS);
  if(b.vy>0){
    const ty=Math.floor((b.y+b.h-0.01)/TS);
    for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){b.y=ty*TS-b.h;b.vy=0;r.ground=true;break;}
  }else if(b.vy<0){
    const ty=Math.floor(b.y/TS), c=Math.floor((b.x+b.w/2)/TS);
    for(const tx of [c,x0,x1]) if(solidAt(tx,ty)){b.y=(ty+1)*TS;b.vy=0;r.head=[tx,ty];break;}
  }
  return r;
}
function hitBlock(tx,ty){
  if(ty<0||ty>=MH||tx<0||tx>=MW) return;
  const t=map[ty][tx];
  if(t===3){
    map[ty][tx]=4; score+=200; coinsN++; sfx('coin');
    popups.push({x:tx*TS+8,y:ty*TS-2,t:36,s:'+200'});
  }else if(t===2){
    map[ty][tx]=0; score+=50; sfx('brk');
    for(let i=0;i<4;i++) particles.push({x:tx*TS+(i%2)*8,y:ty*TS+(i>>1)*8,vx:(i%2?1:-1)*1.2,vy:-3-(i>>1),t:50,w:6});
  }
}
function die(){ if(p.dead) return; p.dead=1; p.vy=-6; p.vx=0; sfx('die'); }
function updFx(){
  for(const q of particles){q.x+=q.vx;q.vy+=0.3;q.y+=q.vy;q.t--;}
  particles=particles.filter(q=>q.t>0);
  for(const q of popups){q.y-=0.6;q.t--;}
  popups=popups.filter(q=>q.t>0);
}

function update(){
  frame++;
  if(state!=='play'){updFx();return;}
  if(p.dead){
    p.dead++; p.vy+=G; p.y+=p.vy; updFx();
    if(p.dead>110){
      lives--;
      if(lives<=0){saveBest();state='over';lockUntil=performance.now()+800;}
      else{buildLevel();resetPlayer();}
    }
    return;
  }
  if(p.win){
    p.win++; updFx();
    if(p.win>150){saveBest();state='clear';lockUntil=performance.now()+800;}
    return;
  }
  // 入力
  const L=keys.left, R=keys.right, max=keys.run?2.4:1.5, acc=0.15;
  if(L&&!R){p.vx-=acc;p.face=-1;}
  else if(R&&!L){p.vx+=acc;p.face=1;}
  else{p.vx*=0.85; if(Math.abs(p.vx)<0.05)p.vx=0;}
  p.vx=Math.max(-max,Math.min(max,p.vx));
  if(keys.jump&&!jumpHeld) jumpBuf=6;
  jumpHeld=keys.jump;
  if(jumpBuf>0){
    jumpBuf--;
    if(p.onGround){p.vy=-(6.6+Math.abs(p.vx)*0.25);p.onGround=false;jumpBuf=0;sfx('jump');}
  }
  if(!keys.jump&&p.vy<-2) p.vy=-2;
  const r=moveBody(p);
  p.onGround=r.ground;
  if(r.head) hitBlock(r.head[0],r.head[1]);
  if(p.x<cam){p.x=cam;p.vx=0;}
  if(p.onGround&&Math.abs(p.vx)>0.1) p.anim+=Math.abs(p.vx)*0.12; else if(!p.onGround) p.anim=1;
  // カメラ
  cam=Math.max(0,Math.min(MW*TS-VW,p.x+p.w/2-VW/2,Math.max(cam,p.x+p.w/2-VW/2)));
  cam=Math.max(cam,0);
  // 落下
  if(p.y>MH*TS+10){die();p.vy=0;return;}
  // コイン
  for(const c of coinList){
    if(c.got) continue;
    const cx=c.x*TS+3, cy=c.y*TS+2;
    if(p.x<cx+10&&p.x+p.w>cx&&p.y<cy+12&&p.y+p.h>cy){
      c.got=true;score+=100;coinsN++;sfx('coin');
      if(coinsN%50===0){lives++;}
    }
  }
  // 敵
  for(const e of enemies){
    if(e.dead){e.dead++;continue;}
    if(!e.active){ if(e.x<cam+VW+32) e.active=true; else continue; }
    e.vx=e.dir*0.5;
    const er=moveBody(e);
    if(er.hx) e.dir*=-1;
    if(e.y>MH*TS+40){e.dead=100;continue;}
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&p.y+p.h-e.y<10){
        e.dead=1;p.vy=keys.jump?-7:-4;score+=200;sfx('stomp');
        popups.push({x:e.x+7,y:e.y-4,t:30,s:'+200'});
      }else{die();return;}
    }
  }
  enemies=enemies.filter(e=>e.dead<30);
  updFx();
  // ゴール
  if(p.x+p.w>FLAGX+4){p.win=1;score+=1000;sfx('win');}
}

// ---------- 描画 ----------
function text(s,x,y,size,align,col){
  ctx.font='bold '+size+'px sans-serif';ctx.textAlign=align||'left';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function cloud(x,y){
  ctx.beginPath();ctx.arc(x,y,10,0,6.3);ctx.arc(x+13,y-5,13,0,6.3);ctx.arc(x+27,y,10,0,6.3);ctx.fill();
}
function tile(t,x,y,tx,ty){
  switch(t){
    case 1:
      ctx.fillStyle='#c84c0c';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x,y+TS-1,TS,1);ctx.fillRect(x+TS-1,y,1,TS);
      if(ty>0&&!map[ty-1][tx]){ctx.fillStyle='#58d020';ctx.fillRect(x,y,TS,4);ctx.fillStyle='#38a010';ctx.fillRect(x,y+4,TS,1);}
      break;
    case 2:
      ctx.fillStyle='#b8541c';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='#000';ctx.fillRect(x,y+7,TS,1);ctx.fillRect(x,y+15,TS,1);
      ctx.fillRect(x+7,y,1,7);ctx.fillRect(x+3,y+8,1,7);ctx.fillRect(x+11,y+8,1,7);
      break;
    case 3:
      ctx.fillStyle=(Math.floor(frame/20)%3===2)?'#ffd860':'#fcb800';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='#8c4c00';ctx.fillRect(x,y,TS,1);ctx.fillRect(x,y+TS-1,TS,1);ctx.fillRect(x,y,1,TS);ctx.fillRect(x+TS-1,y,1,TS);
      ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillStyle='#8c4c00';ctx.fillText('?',x+8,y+12);
      break;
    case 4:
      ctx.fillStyle='#8c6c3c';ctx.fillRect(x,y,TS,TS);ctx.fillStyle='#5c3c1c';ctx.fillRect(x,y,TS,1);ctx.fillRect(x,y+TS-1,TS,1);ctx.fillRect(x,y,1,TS);ctx.fillRect(x+TS-1,y,1,TS);
      break;
    case 5:
      ctx.fillStyle='#b0b0b8';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='#e8e8f0';ctx.fillRect(x,y,TS,2);ctx.fillRect(x,y,2,TS);
      ctx.fillStyle='#606068';ctx.fillRect(x,y+TS-2,TS,2);ctx.fillRect(x+TS-2,y,2,TS);
      break;
    case 7:
      ctx.fillStyle='#10a010';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='#60e060';ctx.fillRect(x+3,y,3,TS);
      ctx.fillStyle='#085008';ctx.fillRect(x+TS-3,y,3,TS);
      if(ty>0&&map[ty-1][tx]!==7){ctx.fillStyle='#10a010';ctx.fillRect(x-1,y,TS+2,6);ctx.fillStyle='#60e060';ctx.fillRect(x+2,y,3,6);ctx.fillStyle='#085008';ctx.fillRect(x-1,y+5,TS+2,1);}
      break;
  }
}
function drawEnemy(e){
  const x=e.x,y=e.y;
  if(e.dead){ctx.fillStyle='#9b30d9';ctx.fillRect(x,y+e.h-5,e.w,5);return;}
  ctx.fillStyle='#9b30d9';ctx.beginPath();ctx.ellipse(x+7,y+8,7,7,0,0,6.3);ctx.fill();
  const f=Math.floor(frame/8)%2;
  ctx.fillStyle='#4b1a73';ctx.fillRect(x+(f?1:3),y+11,4,3);ctx.fillRect(x+(f?9:7),y+11,4,3);
  ctx.fillStyle='#fff';ctx.fillRect(x+3,y+4,3,4);ctx.fillRect(x+8,y+4,3,4);
  ctx.fillStyle='#000';const o=e.dir>0?1:0;ctx.fillRect(x+3+o,y+5,2,3);ctx.fillRect(x+8+o,y+5,2,3);
}
function drawHero(x,y,face,anim,air){
  ctx.save();
  ctx.translate(Math.round(x)+(face<0?p.w:0),Math.round(y));ctx.scale(face,1);
  ctx.fillStyle='#00c8d8';ctx.fillRect(1,0,10,3);ctx.fillRect(7,2,5,2);
  ctx.fillStyle='#fcc088';ctx.fillRect(2,3,8,4);
  ctx.fillStyle='#000';ctx.fillRect(7,4,1,2);
  ctx.fillStyle='#f08000';ctx.fillRect(1,7,10,3);
  ctx.fillStyle='#2038ec';ctx.fillRect(3,9,6,3);
  ctx.fillStyle='#5a3010';
  if(air){ctx.fillRect(0,11,4,3);ctx.fillRect(8,10,4,3);}
  else{const f=Math.floor(anim)%2;ctx.fillRect(f?1:3,12,4,2);ctx.fillRect(f?7:5,12,4,2);}
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#5c94fc';ctx.fillRect(0,0,VW,VH);
  // 背景
  ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){const cx=((i*170-cam*0.4)%1360+1360)%1360-60,cy=30+(i*37)%70;cloud(cx,cy);}
  ctx.fillStyle='#38b838';
  for(let i=0;i<6;i++){const hx=((i*260-cam*0.6)%1560+1560)%1560-100;ctx.beginPath();ctx.ellipse(hx,240,60,30,0,Math.PI,2*Math.PI);ctx.fill();}
  ctx.save();ctx.translate(-Math.floor(cam),0);
  const x0=Math.max(0,Math.floor(cam/TS)),x1=Math.min(MW-1,x0+Math.ceil(VW/TS)+1);
  for(let y=0;y<MH;y++)for(let x=x0;x<=x1;x++){const t=map[y][x];if(t)tile(t,x*TS,y*TS,x,y);}
  // コイン
  const cw=Math.abs(Math.cos(frame/10))*5+1;
  ctx.fillStyle='#ffd800';
  for(const c of coinList){if(c.got||c.x<x0||c.x>x1)continue;ctx.beginPath();ctx.ellipse(c.x*TS+8,c.y*TS+8,cw,6,0,0,6.3);ctx.fill();}
  // ゴール
  ctx.fillStyle='#e0e0e0';ctx.fillRect(FLAGX+6,4*TS,3,11*TS);
  ctx.fillStyle='#ffd800';ctx.beginPath();ctx.arc(FLAGX+7.5,4*TS-1,4,0,6.3);ctx.fill();
  ctx.fillStyle='#20c020';ctx.beginPath();ctx.moveTo(FLAGX+6,4*TS+4);ctx.lineTo(FLAGX-10,4*TS+12);ctx.lineTo(FLAGX+6,4*TS+20);ctx.fill();
  for(const e of enemies) if(e.active||e.dead) drawEnemy(e);
  drawHero(p.x,p.y,p.face,p.anim,!p.onGround||p.dead);
  ctx.fillStyle='#b8541c';
  for(const q of particles)ctx.fillRect(Math.round(q.x),Math.round(q.y),q.w,q.w);
  for(const q of popups)text(q.s,q.x,q.y,10,'center','#fff');
  ctx.restore();
  // HUD
  text('SCORE '+String(score).padStart(6,'0'),8,16,11,'left');
  text('COIN ×'+String(coinsN).padStart(2,'0'),130,16,11,'left');
  text('LIFE ×'+lives,210,16,11,'left');
  text('BEST '+best,VW-44,30,10,'right','#ffe');
  // 画面
  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,VW,VH);
    if(state==='title'){
      text('ピクセルヒーロー',VW/2,90,28,'center','#ffd800');
      drawHero(VW/2-6,110+Math.sin(frame/10)*3,1,frame/8,false);
      text('タップ / Enter でスタート',VW/2,170,14,'center');
      text('← → 移動　Space/Z ジャンプ　Shift/X ダッシュ',VW/2,194,10,'center','#cfe');
      text(offlineReady?'✓ オフライン対応済み':(offMsg||'オフライン準備中…'),VW/2,220,11,'center',offlineReady?'#8f8':(offMsg?'#f88':'#fc8'));
    }else if(state==='over'){
      text('GAME OVER',VW/2,110,28,'center','#f66');
      text('スコア '+score,VW/2,145,14,'center');
      text('タップでタイトルへ',VW/2,180,12,'center');
    }else{
      text('STAGE CLEAR!',VW/2,110,28,'center','#ffd800');
      text('スコア '+score,VW/2,145,14,'center');
      text('タップでタイトルへ',VW/2,180,12,'center');
    }
  }
}

// ---------- 入力 ----------
function act(){
  if(performance.now()<lockUntil) return;
  if(state==='title') start();
  else if(state==='over'||state==='clear') state='title';
}
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',ShiftLeft:'run',ShiftRight:'run',KeyX:'run'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(k){keys[k]=true;e.preventDefault();}
  if(!e.repeat&&(e.code==='Enter'||k==='jump')) act();
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.classList.add('on');});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');}));
});
document.addEventListener('pointerdown',e=>{if(e.target.id==='mute')return;act();});
document.addEventListener('contextmenu',e=>e.preventDefault());
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window) document.getElementById('pad').style.display='flex';

// ---------- PWA(Service Worker) ----------
if(!('serviceWorker' in navigator)){
  offMsg=location.protocol==='file:'?'× file://では不可(https://で開いてください)':'× このブラウザはオフライン保存に非対応';
}else if(!window.isSecureContext){
  offMsg='× https://で開いてください';
}else{
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>{offMsg='× 登録失敗: '+(e&&e.message||e);});
    navigator.serviceWorker.ready.then(()=>caches.match('./index.html')).then(r=>{
      if(r){offlineReady=true;}else{offMsg='× 保存に失敗(再読み込みしてください)';}
    }).catch(e=>{offMsg='× 保存に失敗: '+(e&&e.message||e);});
  });
}

// ---------- ループ ----------
buildLevel();resetPlayer();
let last=performance.now(),accT=0;
function loop(t){
  accT+=Math.min(100,t-last);last=t;
  while(accT>=1000/60){update();accT-=1000/60;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
